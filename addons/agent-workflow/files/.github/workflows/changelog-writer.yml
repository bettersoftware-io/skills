name: Changelog writer

# Writes the changelog entry for each finished week that has none, with Claude
# Code, and opens one pull request for them. A person reviews and merges it:
# this workflow never merges.
#
# It costs money. Each run that finds a week due makes Claude Code calls billed
# to your Anthropic account, up to 40 turns. A run that finds nothing due
# installs nothing and calls nothing.
#
# Off until a project switches it on: set the repository variable
# CHANGELOG_WRITER to `true` (Settings, Secrets and variables, Actions,
# Variables) and add the secret ANTHROPIC_API_KEY. Without the variable the job
# is skipped. With it and without the secret the run fails, and says so.
#
# Runs on Monday just after weekly-tag.yml has tagged the finished week, and by
# hand. The weeks are the ones `pnpm changelog due` lists.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

# Two runs at once would write the same week twice. The second waits, then
# finds the entry on the default branch, or the open pull request, and stops.
concurrency:
  group: changelog-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  write:
    name: write the changelog entries that are due
    if: vars.CHANGELOG_WRITER == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the changelog/<week> branch
      pull-requests: write # opens the pull request
      issues: read # reads the issue weekly-tag.yml opened for the week
    env:
      # pnpm comes from Corepack; without this its first run can stop to ask.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A run by hand may start from any branch. The entries are the default
          # branch's. A scheduled run has no value here and takes the default branch.
          ref: ${{ github.event.repository.default_branch }}
          # `due` reads the history for the merges of each week.
          fetch-depth: 0
          # Claude Code is given its own token below: keep the token out of
          # .git/config.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # Plain Node, nothing installed: a week that is not due, or a missing
      # secret, costs no install and no call.
      - name: Check the secret, then what is due
        id: due
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set: add the secret or unset CHANGELOG_WRITER"
            exit 1
          fi
          status=0
          node tools/agent-workflow/changelog.mts due --ref HEAD > "$RUNNER_TEMP/due.txt" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/due.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/due.txt"
            exit 1
          fi

      # Node 25 and later ship without Corepack. This installs it from a
      # lockfile, so its version is pinned like every other.
      - name: Enable Corepack (provisions the pnpm pinned by the packageManager field)
        if: steps.due.outputs.due == 'true'
        run: node tools/arch/ci/enable-corepack.mts

      - name: Install dependencies
        if: steps.due.outputs.due == 'true'
        run: pnpm install --frozen-lockfile

      # `github_token` is the token Claude Code pushes and opens the pull
      # request with. The checkout keeps none, and without this input the action
      # asks GitHub for an app token over OIDC, which needs id-token: write that
      # this job does not have. The job's own token holds exactly the three
      # permissions above. No tool that merges is allowed.
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        if: steps.due.outputs.due == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Follow .claude/commands/workflow/changelog.md for the weeks `pnpm changelog due` lists, in its "In CI" form.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(pnpm changelog weeks),Bash(pnpm changelog prs:*),Bash(pnpm changelog check:*),Bash(pnpm changelog defs:*),Bash(pnpm changelog due:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh issue list:*),Bash(gh repo view:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin changelog/*),Read,Write,Edit"
