name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # pnpm comes from Corepack; without this its first run can stop to ask.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  repository:
    name: typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Node 25 and later ship without Corepack. This installs it from a
      # lockfile, so its version is pinned like every other. After checkout: the
      # script is in the repository.
      - name: Enable Corepack (provisions the pnpm pinned by the packageManager field)
        run: node kit/ci/enable-corepack.mts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the kit, the scripts and the add-ons' tools
        run: pnpm typecheck

      # Corepack may not fetch here. The pinned pnpm is already provisioned, so
      # nothing needs it to. A test that runs pnpm in a project with no
      # `packageManager` field would otherwise fetch the newest pnpm and run
      # that: unpinned, and slow enough to time a test out.
      - name: Tests
        run: pnpm test
        env:
          COREPACK_ENABLE_NETWORK: 0

  project:
    # The thing this repository ships is a project. So CI creates one the way
    # a person would, with a scope of its own, and holds it to its own gate:
    # first as created, then with each add-on in.
    name: a created project passes its gate (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [none, coverage, visual, performance, format-lint, ci-security, repo-hygiene, strict-lint, agent-workflow, e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Node 25 and later ship without Corepack. This installs it from a
      # lockfile, so its version is pinned like every other. After checkout: the
      # script is in the repository.
      - name: Enable Corepack (provisions the pnpm pinned by the packageManager field)
        run: node kit/ci/enable-corepack.mts

      # Outside this checkout, as a real project would be. Set in a step: the
      # runner's folders are not known where a job's `env` is read.
      - name: Choose where the project goes
        run: echo "PROJECT=$RUNNER_TEMP/project" >> "$GITHUB_ENV"

      # A long scope on purpose: the starter is written with `@app`, and a
      # longer name moves where a line wraps and how a name sorts. Anything
      # that only holds for a short scope fails here.
      - name: Create a project from the starter
        run: node scripts/create-project.mts "$PROJECT" --scope @ci-organisation-with-a-long-name

      - name: Install it from the lockfile it was created with
        working-directory: ${{ env.PROJECT }}
        run: pnpm install --frozen-lockfile

      - name: Its gate, as created
        working-directory: ${{ env.PROJECT }}
        run: pnpm gate:full

      # CI starts with an empty cache, so a task that replays a stale result
      # can never show up as a wrong verdict here. It is asked about directly.
      - name: Its cached tasks notice a change upstream
        if: matrix.addon == 'none'
        run: node scripts/check-task-cache.mts "$PROJECT"

      - name: Add the add-on
        if: matrix.addon != 'none'
        run: node scripts/add-to-project.mts "$PROJECT" ${{ matrix.addon }}

      - name: Install what the add-on needs
        if: matrix.addon != 'none'
        working-directory: ${{ env.PROJECT }}
        run: pnpm install --no-frozen-lockfile

      # An add-on may ask for one command to be run once (format-lint: its
      # fixer). The installer prints it under "Next"; this runs it the same way.
      - name: Run what the add-on asks to be run once
        if: matrix.addon != 'none'
        working-directory: ${{ env.PROJECT }}
        env:
          MANIFEST: ${{ github.workspace }}/addons/${{ matrix.addon }}/addon.json
        run: |
          first_run="$(node -p "require(process.env.MANIFEST).firstRun ?? ''")"
          if [ -n "$first_run" ]; then
            echo "$ $first_run"
            sh -c "$first_run"
          fi

      # The static checks of every add-on join gate:fast or gate:full, so the
      # project's own gate is the proof. What needs a browser and committed
      # images (the visual goldens, the runtime motion audit) is not run here.
      - name: Its gate, with the add-on in
        if: matrix.addon != 'none'
        working-directory: ${{ env.PROJECT }}
        run: pnpm gate:full

      # The e2e add-on joins no gate: its run needs a browser. So this job
      # brings one, the build Playwright's npm package asks for, with the
      # system libraries it needs, and runs the specs for real. Without this
      # nothing here would start the shipped specs at all.
      - name: Install the browser the e2e add-on drives
        if: matrix.addon == 'e2e'
        working-directory: ${{ env.PROJECT }}
        run: pnpm --dir packages/e2e exec playwright install --with-deps chromium

      - name: Its end-to-end specs, against a build of the project just created
        if: matrix.addon == 'e2e'
        working-directory: ${{ env.PROJECT }}
        run: pnpm e2e

  bare-project:
    # A project that was not created from the starter takes it with the
    # installer: the kit, then the starter. The project here has nothing but
    # a package.json, so every file of the starter's goes in through the unit,
    # and none through the creation script. Its gate is the proof that the two
    # units together give a project what creating one does.
    name: a project with only a package.json passes its gate after the kit and the starter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Enable Corepack (provisions the pnpm pinned by the packageManager field)
        run: node kit/ci/enable-corepack.mts

      - name: Choose where the project goes
        run: echo "PROJECT=$RUNNER_TEMP/project" >> "$GITHUB_ENV"

      - name: A project with only a package.json, in a repository
        run: |
          mkdir -p "$PROJECT"
          printf '{\n  "name": "bare",\n  "private": true\n}\n' > "$PROJECT/package.json"
          git -C "$PROJECT" init --quiet

      # The long scope, as above: it wraps lines and sorts where `@app` does not.
      - name: Add the kit
        run: node scripts/add-to-project.mts "$PROJECT" kit --scope @ci-organisation-with-a-long-name

      - name: Add the starter
        run: node scripts/add-to-project.mts "$PROJECT" starter --scope @ci-organisation-with-a-long-name

      # No lockfile: the starter's is pnpm's to write, and this project had none.
      - name: Install it
        working-directory: ${{ env.PROJECT }}
        run: pnpm install --no-frozen-lockfile

      - name: Its gate
        working-directory: ${{ env.PROJECT }}
        run: pnpm gate:full

      # A second run of the starter writes nothing: every file it ships has
      # been met. What the project has is committed first, so git says what
      # the run changed; the build's output is in the starter's .gitignore.
      - name: The starter again changes nothing
        run: |
          git -C "$PROJECT" add -A
          git -C "$PROJECT" -c user.name=ci -c user.email=ci@example.invalid commit --quiet -m "the kit and the starter"
          node scripts/add-to-project.mts "$PROJECT" starter
          changed="$(git -C "$PROJECT" status --porcelain)"
          if [ -n "$changed" ]; then
            echo "A second run of the starter changed the project:"
            echo "$changed"
            exit 1
          fi

  project-with-every-add-on:
    # The matrix above adds each add-on alone. A person takes several, and two
    # add-ons can be right alone and wrong together (a knip finding once
    # appeared only with `visual` and without `performance`). So one project
    # gets all of them, under two scopes: the long one wraps lines and sorts
    # before `@playwright` and `@types`, and `@zeta` sorts after them. A
    # package.json whose dependencies are in order for one scope only fails
    # the version check under the other.
    name: a project created with every add-on passes its gate (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: ["@ci-organisation-with-a-long-name", "@zeta"]
    env:
      ADDONS: coverage,visual,performance,format-lint,ci-security,repo-hygiene,strict-lint,agent-workflow,e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Enable Corepack (provisions the pnpm pinned by the packageManager field)
        run: node kit/ci/enable-corepack.mts

      - name: Choose where the project goes
        run: echo "PROJECT=$RUNNER_TEMP/project" >> "$GITHUB_ENV"

      - name: Create a project from the starter, with every add-on
        env:
          SCOPE: ${{ matrix.scope }}
        run: node scripts/create-project.mts "$PROJECT" --scope "$SCOPE" --with "$ADDONS"

      # The stop hook, the hygiene checks and the typed lint ask git which
      # files the project has. A project is a repository from its first day.
      - name: Make it a repository
        working-directory: ${{ env.PROJECT }}
        run: git init --quiet

      # Not frozen: the add-ons added dependencies the starter's lockfile does not have.
      - name: Install what the add-ons need
        working-directory: ${{ env.PROJECT }}
        run: pnpm install --no-frozen-lockfile

      # What the creation script prints under "Next": each add-on's command
      # to run once, in the order the add-ons were added.
      - name: Run what the add-ons ask to be run once
        working-directory: ${{ env.PROJECT }}
        env:
          ADDONS_FOLDER: ${{ github.workspace }}/addons
        run: |
          for addon in $(echo "$ADDONS" | tr ',' ' '); do
            first_run="$(MANIFEST="$ADDONS_FOLDER/$addon/addon.json" node -p "require(process.env.MANIFEST).firstRun ?? ''")"
            if [ -n "$first_run" ]; then
              echo "$ $first_run"
              sh -c "$first_run"
            fi
          done

      - name: Its gate, with every add-on in
        working-directory: ${{ env.PROJECT }}
        run: pnpm gate:full

      - name: Install the browser the e2e add-on drives
        working-directory: ${{ env.PROJECT }}
        run: pnpm --dir packages/e2e exec playwright install --with-deps chromium

      - name: Its end-to-end specs, against a build of the project just created
        working-directory: ${{ env.PROJECT }}
        run: pnpm e2e
