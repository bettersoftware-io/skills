schema_version: "1.1"
name: trigger-create-loose
description: "A new project asked for without naming ports and adapters or RxJS."
tags: [trigger, creating-a-project]
execution:
  prompt: "This folder is empty. I want to build a live price dashboard in React and TypeScript, with a clean architecture underneath and the data streamed all the way to the screen. Set the project up for me."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-creating-a-project
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?creating-a-project"'
