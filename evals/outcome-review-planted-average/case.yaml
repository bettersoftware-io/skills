schema_version: "1.1"
name: outcome-review-planted-average
description: "A change that works out an average in a component. Does the review find it?"
tags: [outcome, reviewing-architecture]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "I added the average of the mids under the price list in packages/client-react/src/ui/PriceList.tsx, so the desk can see where the market sits. Review it before I merge. You cannot run commands in this session, so read the code."
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-reviewing-architecture
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reviewing-architecture"'
  - type: llm
    name: finds-the-average
    criteria: |
      PASS if the review reports as a problem that PriceList.tsx works out the average itself, and says that value belongs in the core: the presenter, the view model or the domain, computed once there and handed to the component.
      FAIL if the average being computed in the component is not reported as a problem, if the review approves the change, or if it reports only style, naming, empty-list handling or performance.
