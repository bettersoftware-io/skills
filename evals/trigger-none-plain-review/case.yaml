schema_version: "1.1"
name: trigger-none-plain-review
description: "A review in a project that has no kit and no ports-and-adapters layout."
tags: [trigger, none]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Review packages/api/src/orders.ts for bugs before I merge."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: leaves-creating-a-project
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?creating-a-project"'
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: leaves-documenting-architecture
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?documenting-architecture"'
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: leaves-extending-a-project
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?extending-a-project"'
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: leaves-reviewing-architecture
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reviewing-architecture"'
    min: 0
    max: 0
    arm: both
