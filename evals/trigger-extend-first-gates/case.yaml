schema_version: "1.1"
name: trigger-extend-first-gates
description: "An existing project asking for the gates: extending, where creating is the near miss."
tags: [trigger, extending-a-project]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "This is an existing TypeScript monorepo. I want the architecture gates added to it."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-extending-a-project
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?extending-a-project"'
  - type: tool_used
    name: leaves-creating-a-project
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?creating-a-project"'
    min: 0
    max: 0
    arm: both
