schema_version: "1.1"
name: trigger-extend-ci-security
description: "An add-on the description did not name until 0.13.1, asked for without its name."
tags: [trigger, extending-a-project]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "I want CI to check our dependencies and our workflows for security problems. Set that up."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-extending-a-project
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?extending-a-project"'
