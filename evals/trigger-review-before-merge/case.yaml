schema_version: "1.1"
name: trigger-review-before-merge
description: "A review asked for before merging, with no mention of architecture."
tags: [trigger, reviewing-architecture]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "I have finished my change to the price list in packages/client-react. Review it before I merge."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-reviewing-architecture
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reviewing-architecture"'
