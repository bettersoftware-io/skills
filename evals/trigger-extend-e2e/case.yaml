schema_version: "1.1"
name: trigger-extend-e2e
description: "One add-on asked for plainly, in a project that has the kit."
tags: [trigger, extending-a-project]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "Add end-to-end tests to this project."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-extending-a-project
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?extending-a-project"'
