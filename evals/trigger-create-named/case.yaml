schema_version: "1.1"
name: trigger-create-named
description: "A new project asked for in the skill's own words, in an empty folder."
tags: [trigger, creating-a-project]
execution:
  prompt: "Start a new project in this folder called orders-desk. A TypeScript monorepo built on ports and adapters, with RxJS streams feeding a React UI."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-creating-a-project
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?creating-a-project"'
